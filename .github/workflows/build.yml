name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Descompactar projeto
        run: unzip -q projeto.zip -d projeto

      - name: Compilar
        run: gradle -p projeto assembleDebug --no-daemon

      - name: Publicar APK numa Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Ajudante de Tela (compilação ${{ github.run_number }})
          files: projeto/app/build/outputs/apk/debug/app-debug.apk
